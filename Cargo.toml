[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossbeam = "0.8.4"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "gzip", "rustls"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tellus = { version = "=0.5.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
hegeltest = { version = "=0.49.2", features = ["static-engine"] }
loom = "=0.7.2"
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
